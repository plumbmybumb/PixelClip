# XcodeGen spec — the SOURCE OF TRUTH for the Xcode project.
# Never hand-edit PixelClip.xcodeproj. Edit THIS file, then run ./build.sh.
name: PixelClip

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Set your own Apple team id here (Xcode ▸ Settings ▸ Accounts) to build for a device.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

packages:
  PixelClipKit:
    path: PixelClipKit

targets:
  PixelClip:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Resources/Fonts
          - Resources/Starter
          - Resources/Tarot
      # The OFL fonts keep their per-family folders (each has its own OFL.txt), so they go in as a
      # folder reference: PixelClip.app/Fonts/<Family>/… (the UIAppFonts paths below).
      - path: Sources/Resources/Fonts
        type: folder
        buildPhase: resources
      # The PixelClip pack (20 loops + starter.json): PixelClip.app/Starter/….
      - path: Sources/Resources/Starter
        type: folder
        buildPhase: resources
      # The Tarot oracle's deck (Jean Dodal, Lyon 1701; BnF via Wikimedia Commons, public domain: the 22
      # trumps + back, 236×448 PNG) and the app's own readings (readings.json):
      # PixelClip.app/Tarot/….
      - path: Sources/Resources/Tarot
        type: folder
        buildPhase: resources
      # The Share Extension's inboxes (texts → Reader, photos/videos → Send) and its sheet (the app
      # imports the inboxes when it becomes active and shows the sheet in the `-PixelClipScreen share` harness).
      - path: Shared
      - path: ShareExtension/ShareSheetView.swift
      - path: ShareExtension/MediaInbox.swift
    dependencies:
      - package: PixelClipKit
      - target: PixelClipShare
    entitlements:
      path: Sources/PixelClip.entitlements
      properties:
        # NEHotspotConfiguration (join the clip's "PixelClip-XXXX" SoftAP). Needs a paid team.
        com.apple.developer.networking.HotspotConfiguration: true
        # Shared with the PixelClipShare extension: texts and links saved from Safari/Notes (Reader).
        com.apple.security.application-groups:
          - group.com.example.pixelclip
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: PixelClip
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        CFBundleDevelopmentRegion: en
        ITSAppUsesNonExemptEncryption: false
        # English here; French in Sources/Resources/fr.lproj/InfoPlist.strings. The hotspot join and
        # notifications have no Info.plist strings: iOS words those prompts itself.
        NSLocalNetworkUsageDescription: PixelClip sends pictures and settings to your clip over the clip’s own Wi‑Fi.
        # Bluetooth LE "doorbell" (PROTOCOL §3): wakes the clip so it turns its Wi‑Fi on. Bluetooth is
        # foreground only (Home peeks every 30 s); the app drops its link whenever it goes to the background.
        NSBluetoothAlwaysUsageDescription: PixelClip uses Bluetooth to wake your clip and turn on its Wi‑Fi, so you don’t have to press its button.
        NSPhotoLibraryUsageDescription: PixelClip uses the photos and videos you pick to make pictures for your clip.
        NSPhotoLibraryAddUsageDescription: PixelClip saves screenshots of your clip to your photo library when you ask.
        NSAppTransportSecurity:
          # The clip speaks plain HTTP on 192.168.4.1 / pixelclip.local (its own SoftAP, WPA2).
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # iPhone only. Portrait and both landscapes are declared, but the app delegate narrows them per
        # screen (OrientationLock): portrait everywhere except Draw.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Still needed with landscape declared: without all four orientations (upside down included)
        # the archive warns "All interface orientations must be supported unless the app requires full
        # screen" (UIRequiresFullScreen is deprecated in iOS 26). TARGETED_DEVICE_FAMILY is 1, so
        # this iPad list never applies.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Automatic
        # Bundled OFL fonts (Sources/Resources/Fonts, copied as a folder). Written by tools/fonts/fetch_fonts.py.
        # BEGIN UIAppFonts (tools/fonts/fetch_fonts.py)
        UIAppFonts:
          - Fonts/PressStart2P/PressStart2P-Regular.ttf
          - Fonts/Silkscreen/Silkscreen-Regular.ttf
          - Fonts/Silkscreen/Silkscreen-Bold.ttf
          - Fonts/VT323/VT323-Regular.ttf
          - Fonts/DotGothic16/DotGothic16-Regular.ttf
          - Fonts/PixelifySans/PixelifySans-VF.ttf
          - Fonts/Tiny5/Tiny5-VF.ttf
          - Fonts/Bungee/Bungee-Regular.ttf
          - Fonts/Monoton/Monoton-Regular.ttf
          - Fonts/BebasNeue/BebasNeue-Regular.ttf
          - Fonts/RubikMonoOne/RubikMonoOne-Regular.ttf
          - Fonts/Righteous/Righteous-Regular.ttf
          - Fonts/Orbitron/Orbitron-VF.ttf
          - Fonts/Audiowide/Audiowide-Regular.ttf
          - Fonts/UnicaOne/UnicaOne-Regular.ttf
          - Fonts/AbrilFatface/AbrilFatface-Regular.ttf
          - Fonts/MajorMonoDisplay/MajorMonoDisplay-Regular.ttf
          - Fonts/Pacifico/Pacifico-Regular.ttf
          - Fonts/Lobster/Lobster-Regular.ttf
          - Fonts/DancingScript/DancingScript-VF.ttf
          - Fonts/Caveat/Caveat-VF.ttf
          - Fonts/PlayfairDisplay/PlayfairDisplay-VF.ttf
          - Fonts/PlayfairDisplay/PlayfairDisplay-Italic-VF.ttf
          - Fonts/SpaceGrotesk/SpaceGrotesk-VF.ttf
          - Fonts/Fredoka/Fredoka-VF.ttf
        # END UIAppFonts
    settings:
      base:
        PRODUCT_NAME: PixelClip
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pixelclip
        INFOPLIST_KEY_CFBundleDisplayName: PixelClip

  # Share Extension "PixelClip": a photo, GIF or video from Photos or any app (→ Send's crop screen), or a text
  # or link from Safari, Notes… (→ the Reader extra). Small and dependency-free (no PixelClipKit): it writes
  # into the App Group inboxes; the app picks them up when it becomes active.
  PixelClipShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes:
          - Info.plist
          - PixelClipShare.entitlements
      - path: Shared
    entitlements:
      path: ShareExtension/PixelClipShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.pixelclip
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: PixelClip
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionJavaScriptPreprocessingFile: PixelClipSharePreprocessor
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsMovieWithMaxCount: 1
    settings:
      base:
        PRODUCT_NAME: PixelClipShare
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pixelclip.share
        INFOPLIST_KEY_CFBundleDisplayName: PixelClip
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  # UI smoke check (./build.sh test): Home → Send (picker cancelled) → Write → Playlist → Settings → back.
  PixelClipUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PixelClip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pixelclip.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PixelClip
        SWIFT_VERSION: "6.0"

schemes:
  PixelClip:
    build:
      targets:
        PixelClip: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: PixelClipKit/PixelClipKitTests
        - PixelClipUITests
    archive:
      config: Release
